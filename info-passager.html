<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM travel — Informations passager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>

  <!-- TOP BAR -->
  <div class="search-topbar">
    <button class="search-toggle" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a href="dashboard.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="27" fill="#fff"/><path d="M4 28 A24 24 0 0 1 52 28 L52 30 A24 24 0 0 0 4 30 Z" fill="#0b5c3d"/><circle cx="20" cy="20" r="9" fill="#f5921b"/><path d="M10 40 L22 22 L30 34 L36 26 L46 40 Z" fill="#0b5c3d"/><path d="M6 44 Q28 34 50 44 L50 50 Q28 42 6 50 Z" fill="#0b5c3d"/></svg>
      <div class="brand-text"><h1><span class="cam">CAM</span> <span class="travel">travel</span></h1></div>
    </a>
    <div class="search-dropdown">
      <a href="index.html">Accueil</a>
      <a href="dashboard.html">Tableau de bord</a>
      <a href="recherche.html">Rechercher un trajet</a>
    </div>
  </div>

  <!-- STEPPER -->
  <div class="stepper">
    <div class="step"><div class="num">1</div><span class="label">Rechercher</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="num">2</div><span class="label">Sélectionner</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="num">3</div><span class="label">Sièges</span></div>
    <div class="step-line"></div>
    <div class="step active"><div class="num">4</div><span class="label">Passagers</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="num">5</div><span class="label">Paiement</span></div>
  </div>

  <div class="passenger-wrap">
    <div class="passenger-card">
      <h2>Informations des passagers</h2>

      <div class="status-banner" id="statusBanner"></div>

      <form id="passengerForm" novalidate>
        <div id="passengerBlocks"></div>

        <button type="button" class="btn-add-passenger" id="addPassengerBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Ajouter un passager
        </button>

        <div style="margin-top:24px;">
          <button type="submit" class="btn-primary" id="submitBtn">Continuer</button>
        </div>
      </form>
    </div>
  </div>

<script src="js/nav-toggle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data-store.js"></script>
<script src="js/script-passager.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
