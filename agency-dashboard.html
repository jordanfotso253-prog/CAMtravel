<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM travel — Espace agence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="dash-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <a href="agency-dashboard.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="27" fill="#fff"/><path d="M4 28 A24 24 0 0 1 52 28 L52 30 A24 24 0 0 0 4 30 Z" fill="#0b5c3d"/><circle cx="20" cy="20" r="9" fill="#f5921b"/><path d="M10 40 L22 22 L30 34 L36 26 L46 40 Z" fill="#0b5c3d"/><path d="M6 44 Q28 34 50 44 L50 50 Q28 42 6 50 Z" fill="#0b5c3d"/></svg>
      <div class="brand-text"><h1><span class="cam">CAM</span> <span class="travel">travel</span></h1></div>
    </a>
    <nav class="sidebar-nav">
      <a href="agency-dashboard.html" class="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Tableau de bord
      </a>
    </nav>
    <div class="sidebar-footer">
      <nav class="sidebar-nav">
        <a href="index.html" onclick="camtravelLogout(event)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          Déconnexion
        </a>
      </nav>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div class="dash-greeting">
        <h2 id="agencyGreeting">Espace agence</h2>
        <p id="agencyStatusLine"></p>
      </div>
    </div>

    <div class="status-banner" id="statusBanner"></div>

    <div class="stat-cards" style="grid-template-columns:repeat(3,1fr); margin-bottom:22px;">
      <div class="stat-card">
        <div class="icon-box purple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 3l-9 9"/><path d="M15 3h6v6"/></svg>
        </div>
        <div><p class="label">Mes trajets</p><p class="value" id="statTrips">0</p></div>
      </div>
      <div class="stat-card">
        <div class="icon-box green">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16"/></svg>
        </div>
        <div><p class="label">Réservations</p><p class="value" id="statBookings">0</p></div>
      </div>
      <div class="stat-card">
        <div class="icon-box orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/></svg>
        </div>
        <div><p class="label">Chiffre d'affaires</p><p class="value" id="statRevenue">0 FCFA</p></div>
      </div>
    </div>

    <div class="panel">
      <h3>Ajouter un trajet</h3>
      <form id="tripForm">
        <div class="row">
          <div class="field">
            <label for="tFrom">Ville de départ</label>
            <div class="input-wrap">
              <select id="tFrom" style="width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; font-family:'Inter',sans-serif; background:#fff;">
                <option value="">Choisir une ville</option>
                <option>Yaoundé</option><option>Douala</option><option>Bafoussam</option><option>Bertoua</option><option>Garoua</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="tTo">Ville d'arrivée</label>
            <div class="input-wrap">
              <select id="tTo" style="width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:9px; font-size:14px; font-family:'Inter',sans-serif; background:#fff;">
                <option value="">Choisir une ville</option>
                <option>Yaoundé</option><option>Douala</option><option>Bafoussam</option><option>Bertoua</option><option>Garoua</option>
              </select>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="tDep">Heure de départ</label>
            <div class="input-wrap"><input type="text" id="tDep" placeholder="08:00 AM" required></div>
          </div>
          <div class="field">
            <label for="tArr">Heure d'arrivée</label>
            <div class="input-wrap"><input type="text" id="tArr" placeholder="10:30 AM" required></div>
          </div>
          <div class="field">
            <label for="tDuration">Durée</label>
            <div class="input-wrap"><input type="text" id="tDuration" placeholder="2h30m"></div>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="tPrice">Prix (FCFA)</label>
            <div class="input-wrap"><input type="number" id="tPrice" placeholder="12500" required min="0"></div>
          </div>
          <div class="field">
            <label for="tSeats">Nombre de sièges</label>
            <div class="input-wrap"><input type="number" id="tSeats" value="40" min="4" max="80"></div>
          </div>
          <div class="field">
            <label for="tTags">Équipements</label>
            <div class="input-wrap"><input type="text" id="tTags" placeholder="VIP,Climatisé,WiFi"></div>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width:auto; padding:12px 26px;">Ajouter le trajet</button>
      </form>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h3>Mes trajets</h3>
      <div id="tripsList"></div>
    </div>

    <div class="panel" style="margin-top:20px;">
      <h3>Réservations sur mes trajets</h3>
      <div id="bookingsList"></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data-store.js"></script>
<script src="js/agency-guard.js"></script>
<script src="js/script-agency-dashboard.js"></script>
</body>
</html>
