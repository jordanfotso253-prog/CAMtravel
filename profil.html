  <main class="dash-main">
    <div class="page-header-row">
      <h2>Mon profil</h2>
    </div>

    <div class="status-banner" id="statusBanner" style="max-width:600px;"></div>

    <div class="profile-card">
      <div class="profile-avatar" id="avatarInitials">JD</div>

      <form id="profileForm">
        <div class="row">
          <div class="field">
            <label for="pNom">Nom complet</label>
            <div class="input-wrap">
              <input type="text" id="pNom" placeholder="Nom complet">
            </div>
          </div>
          <div class="field">
            <label for="pTel">Téléphone</label>
            <div class="input-wrap">
              <input type="tel" id="pTel" placeholder="Téléphone">
            </div>
          </div>
        </div>
        <div class="field">
          <label for="pEmail">Email</label>
          <div class="input-wrap">
            <input type="email" id="pEmail" placeholder="Email">
          </div>
        </div>
        <div class="field">
          <label for="pVille">Ville</label>
          <div class="input-wrap">
            <input type="text" id="pVille" placeholder="Ville">
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width:auto; padding:12px 26px;">Enregistrer les modifications</button>
      </form>
    </div>

    <p style="max-width:600px; font-size:12px; color:var(--gray-text); margin-top:16px;">
      ⚠️ Ce projet n'a pas encore de vrai système de connexion par compte : ce profil affiche les informations du dernier compte créé sur cet appareil, à titre de démonstration.
