    <div class="profile-card anim-fade-up">

          <div class="s-title" data-i18n="settings.lang">Langue</div>

          <option value="fr">Français</option>
          <option value="en">English</option>

          <div class="s-title" data-i18n="settings.theme">Thème</div>

        </div>

          <option value="light">Clair</option>
          <option value="dark">Sombre</option>
        </select>
      </div>
    
      <div class="settings-row">
        <div>
          <div class="s-title">Notifications push</div>
          <div class="s-sub">Alertes réservations sur cet appareil</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

<script src="js/push-notifications.js"></script>
<script src="js/agency-guard.js"></script>
<script src="js/script-parametres.js"></script>
<script>
document.getElementById('pushEnableAgency')?.addEventListener('click', async () => {
  if (typeof camtravelPush === 'undefined') return;
  const res = await camtravelPush.requestPermission();
  const b = document.getElementById('statusBanner');
  if (b) {
    b.className = 'status-banner show ' + (res.ok ? 'success' : 'error');
    b.textContent = res.ok ? 'Notifications push activées.' : 'Impossible d\'activer (permission refusée ou non supporté).';
  }
  if (res.ok) camtravelPush.notifyGeneric('CAM travel Agence', 'Notifications agence activées.', 'agency-dashboard.html');
});
</script>
