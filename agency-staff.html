<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAM travel — Équipe agence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
<script src="js/role-menus.js"></script>
</head>
<body class="role-agency">
<div class="dash-layout">
  <aside class="sidebar">
    <a href="agency-dashboard.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="27" fill="#fff"/><path d="M4 28 A24 24 0 0 1 52 28 L52 30 A24 24 0 0 0 4 30 Z" fill="#0b5c3d"/><circle cx="20" cy="20" r="9" fill="#f5921b"/><path d="M10 40 L22 22 L30 34 L36 26 L46 40 Z" fill="#0b5c3d"/><path d="M6 44 Q28 34 50 44 L50 50 Q28 42 6 50 Z" fill="#0b5c3d"/></svg>
      <div class="brand-text"><h1><span class="cam">CAM</span> <span class="travel">travel</span></h1></div>
    </a>
    <nav class="sidebar-nav">
      <a href="agency-dashboard.html">Tableau de bord</a>
      <a href="agency-dashboard.html#trips">Mes trajets</a>
      <a href="agency-dashboard.html#bookings">Réservations</a>
      <a href="agency-staff.html" class="active">Équipe</a>
      <a href="verify-ticket.html">Vérifier ticket</a>
      <a href="agency-parametres.html">Paramètres</a>
      <a href="index.html">← Accueil</a>
    </nav>
  </aside>
  <main class="dash-main">
    <div class="dash-top">
      <div>
        <h2 style="margin:0;">Membres de service</h2>
        <p style="margin:4px 0 0;color:var(--gray-text);font-size:13px;">Chef d'agence, caissier, hôtesse, chauffeur</p>
      </div>
    </div>
    <div class="status-banner" id="statusBanner"></div>

    <div class="stat-cards" id="staffStatCards" style="margin-bottom:18px;">
      <div class="stat-card"><div><p class="label">Total</p><p class="value" id="stTotal">0</p></div></div>
      <div class="stat-card"><div><p class="label">Chefs d'agence</p><p class="value" id="stChef">0</p></div></div>
      <div class="stat-card"><div><p class="label">Caissiers</p><p class="value" id="stCaissier">0</p></div></div>
      <div class="stat-card"><div><p class="label">Hôtesses</p><p class="value" id="stHotesse">0</p></div></div>
      <div class="stat-card"><div><p class="label">Chauffeurs</p><p class="value" id="stChauffeur">0</p></div></div>
    </div>

    <div class="profile-card anim-fade-up" style="margin-bottom:16px;">
      <h3 style="margin-top:0;">Ajouter un membre</h3>
      <form id="staffForm" class="row" style="flex-wrap:wrap;gap:12px;">
        <div class="field" style="flex:1;min-width:140px;">
          <label>Nom complet *</label>
          <input id="sNom" required style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;">
        </div>
        <div class="field" style="flex:1;min-width:140px;">
          <label>Téléphone *</label>
          <input id="sTel" required placeholder="6XXXXXXXX" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;">
        </div>
        <div class="field" style="flex:1;min-width:140px;">
          <label>E-mail</label>
          <input id="sEmail" type="email" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;">
        </div>
        <div class="field" style="flex:1;min-width:140px;">
          <label>Rôle *</label>
          <select id="sRole" required style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;">
            <option value="chef_agence">Chef d'agence</option>
            <option value="caissier">Caissier</option>
            <option value="hotesse">Hôtesse</option>
            <option value="chauffeur" selected>Chauffeur</option>
          </select>
        </div>
        <div class="field" style="flex:1;min-width:140px;">
          <label>N° permis (chauffeurs)</label>
          <input id="sPermis" placeholder="Optionnel" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;">
        </div>
        <div class="field" style="align-self:flex-end;">
          <button class="btn-primary" type="submit" style="width:auto;padding:11px 18px;">Ajouter</button>
        </div>
      </form>
    </div>

    <div class="profile-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3 style="margin:0;">Liste de l'équipe</h3>
        <select id="filterRole" style="padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;">
          <option value="">Tous les rôles</option>
          <option value="chef_agence">Chef d'agence</option>
          <option value="caissier">Caissier</option>
          <option value="hotesse">Hôtesse</option>
          <option value="chauffeur">Chauffeur</option>
        </select>
      </div>
      <div id="staffList"></div>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data-store.js"></script>
<script src="js/staff-store.js"></script>
<script src="js/agency-guard.js"></script>
<script src="js/script-agency-staff.js"></script>
</body>
</html>
